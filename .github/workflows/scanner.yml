name: Scanner Temas Emergentes

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SCANNER_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas requests beautifulsoup4 anthropic pytz

      - name: Test conexion Anthropic
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://api.anthropic.com/v1/models \
            -H "x-api-key: ${{ secrets.ANTHROPIC_KEY }}" \
            -H "anthropic-version: 2023-06-01" || echo "FALLO CONEXION"

      - name: Ejecutar scanner
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: python scanner.py

      - name: Commit y push de datos actualizados
        run: |
          git config --global user.name 'Scanner Bot'
          git config --global user.email 'scanner@github.com'
          git pull --rebase origin main
          git add data.json history.json setups_history.json
          git diff --staged --quiet || git commit -m "Actualizar datos scanner $(date +'%d/%m/%Y %H:%M')"
          git push
